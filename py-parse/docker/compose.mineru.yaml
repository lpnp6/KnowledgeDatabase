# MinerU 4.x single-instance deployment — one card per service
#
# Builds and runs one mineru-kit api-server container bound to one GPU, exposing
# the V1 HTTP API (`POST /v1/file_parse`) that py_parse's MineruClient calls.
#
#   docker compose -f docker/compose.mineru.yaml up -d --build
#
# On a multi-GPU machine, deploy multiple instances distinguished by GPU_INDEX
# and API_PORT (each its own compose project):
#
#   # GPU 0:
#   GPU_INDEX=0 API_PORT=8000 docker compose -f docker/compose.mineru.yaml -p mineru0 up -d --build
#   # GPU 1:
#   GPU_INDEX=1 API_PORT=8001 docker compose -f docker/compose.mineru.yaml -p mineru1 up -d --build
#
# Prerequisites:
#   - Linux or Windows with WSL2 (Docker Desktop); Docker MinerU has no macOS
#     GPU acceleration
#   - NVIDIA GPU (Volta+, 8GB+ VRAM) + working GPU passthrough
#     (verify: docker run --rm --gpus all nvidia/cuda:12.4.0-base-ubuntu22.04 nvidia-smi)
#   - ~40GB free disk for the image + build cache; the first build downloads the
#     vLLM base image and model weights, so it takes a while
#
# Verify: curl http://localhost:8000/v1/health
# Docs:   https://opendatalab.github.io/MinerU/quick_start/docker_deployment/

name: mineru

services:
  mineru-api:
    build:
      context: .
      dockerfile: Dockerfile.mineru
      # Base image / pip / model mirrors can be overridden here
      # args:
      #   VLLM_IMAGE: vllm/vllm-openai:v0.21.0   # or docker.m.daocloud.io/... if Hub is blocked
      #   MINERU_PIP_INDEX: https://mirrors.aliyun.com/pypi/simple
      #   MINERU_MODEL_SOURCE_ARG: modelscope
    image: mineru:4
    container_name: mineru-api-${GPU_INDEX:-0}
    restart: always
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      # weights are baked into the image at build time
      MINERU_MODEL_SOURCE: local
      TZ: Asia/Shanghai
    entrypoint: ["mineru-kit"]
    command:
      - api-server
      - --host
      - 0.0.0.0
      - --port
      - "8000"
    ulimits:
      memlock: -1
      stack: 67108864
    ipc: host
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/v1/health || exit 1"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["${GPU_INDEX:-0}"]   # one card per service
              capabilities: [gpu]
