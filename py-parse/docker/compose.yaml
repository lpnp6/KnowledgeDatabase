# MinerU 解析服务 —— 本地 Docker 部署
#
# 供 py-parse 的 MineruClient 通过 http://localhost:8000 调用（见 py_parse/adapters/mineru_client.py）。
#
# 前提：
#   - Linux 或 Windows WSL2（Docker 版 MinerU 不支持 macOS GPU 加速）
#   - NVIDIA GPU（Volta+，建议 8GB+ 显存）+ NVIDIA Container Toolkit（nvidia-smi 在容器内可见）
#   - 首次启动会下载模型权重（已切 ModelScope 国内源），之后由 mineru-cache 卷持久化
#
# 启动：  docker compose -f docker/compose.yaml up -d
# 健康：  curl http://localhost:8000/health
# 文档：  http://localhost:8000/docs
#
# 注：若 ghcr.io 预构建镜像不可用/版本不符，可从官方仓库自构建：
#   git clone https://github.com/opendatalab/MinerU && cd MinerU/docker
#   docker build -t mineru:latest .   # 再把下面的 image 改成 mineru:latest

services:
  mineru-api:
    image: ghcr.io/opendatalab/mineru-core:latest
    container_name: mineru-api
    restart: always
    ports:
      - "8000:8000"
    environment:
      MINERU_MODEL_SOURCE: modelscope   # 国内模型下载源；网络可达 HuggingFace 时可去掉
      TZ: Asia/Shanghai
      MAX_WORKERS: "4"
    volumes:
      - mineru-cache:/app/cache      # 模型权重缓存（持久化，避免每次重建镜像都重下模型）
      - mineru-uploads:/app/uploads
      - mineru-logs:/app/logs
    # --allow-public-http-client 允许非本机调用（py-parse 从宿主/其它容器访问时需要）
    command: mineru-api --host 0.0.0.0 --port 8000 --allow-public-http-client
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # py-parse：对外暴露 gRPC ParseService，文档抽取委托给上面的 mineru-api。
  py-parse:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: py-parse
    restart: always
    depends_on:
      - mineru-api
    ports:
      - "50051:50051"
    environment:
      MINERU_URL: http://mineru-api:8000   # compose 网络内访问 mineru
      GRPC_HOST: 0.0.0.0
      GRPC_PORT: "50051"
      # 可选：启用 minio/s3 存储后端时取消注释并填入连接配置
      # MINIO_ENDPOINT: minio:9000
      # MINIO_ACCESS_KEY: ...
      # MINIO_SECRET_KEY: ...
      # S3_ENDPOINT_URL: http://minio:9000
      # S3_REGION: us-east-1
      # S3_ACCESS_KEY: ...
      # S3_SECRET_KEY: ...
    healthcheck:
      # 用标准 gRPC health 服务探测（grpcio-health-checking 已在镜像内）
      test:
        - CMD
        - python
        - -c
        - |
          import grpc
          from grpc_health.v1 import health_pb2, health_pb2_grpc
          ch = grpc.insecure_channel('localhost:50051')
          r = health_pb2_grpc.HealthStub(ch).Check(
              health_pb2.HealthCheckRequest(), timeout=5)
          assert r.status == health_pb2.HealthCheckResponse.SERVING
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

volumes:
  mineru-cache:
  mineru-uploads:
  mineru-logs:
