# MinerU 解析服务 + py-parse 异步解析栈 —— 本地 Docker 部署
#
# 服务拓扑：
#   mineru-api   : 文档抽取（GPU，MinerU HTTP API，端口 8000）
#   redis        : Celery broker + 任务状态热缓存
#   postgres     : 任务结果持久化（tasks + chunks）
#   celery-worker: 消费队列，跑 read→extract→chunk 重活
#   py-parse     : gRPC 控制面（SubmitParse / GetResult），端口 50051
#
# 启动：  docker compose -f docker/compose.yaml up -d
# 健康：  curl http://localhost:8000/health        （mineru）
#         docker compose exec redis redis-cli ping （redis）
#         docker compose exec postgres pg_isready -U postgres
#
# 注：若 ghcr.io 预构建镜像不可用/版本不符，可从官方仓库自构建 MinerU：
#   git clone https://github.com/opendatalab/MinerU && cd MinerU/docker
#   docker build -t mineru:latest .   # 再把下面的 image 改成 mineru:latest

x-parse-env: &parse-env
  MINERU_URL: http://mineru-api:8000   # compose 网络内访问 mineru
  REDIS_URL: redis://redis:6379/0
  POSTGRES_DSN: postgresql+psycopg://postgres:postgres@postgres:5432/pyparse
  RESULT_TTL_SECONDS: "3600"
  # 可选：启用 minio/s3 存储后端时取消注释并填入连接配置
  # MINIO_ENDPOINT: minio:9000
  # MINIO_ACCESS_KEY: ...
  # MINIO_SECRET_KEY: ...
  # S3_ENDPOINT_URL: http://minio:9000
  # S3_REGION: us-east-1
  # S3_ACCESS_KEY: ...
  # S3_SECRET_KEY: ...

services:
  mineru-api:
    image: ghcr.io/opendatalab/mineru-core:latest
    container_name: mineru-api
    restart: always
    ports:
      - "8000:8000"
    environment:
      MINERU_MODEL_SOURCE: modelscope   # 国内模型下载源；网络可达 HuggingFace 时可去掉
      TZ: Asia/Shanghai
      MAX_WORKERS: "4"
    volumes:
      - mineru-cache:/app/cache      # 模型权重缓存（持久化，避免每次重建镜像都重下模型）
      - mineru-uploads:/app/uploads
      - mineru-logs:/app/logs
    # --allow-public-http-client 允许非本机调用（py-parse 从其它容器访问时需要）
    command: mineru-api --host 0.0.0.0 --port 8000 --allow-public-http-client
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  redis:
    image: redis:7-alpine
    container_name: py-parse-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:16-alpine
    container_name: py-parse-postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pyparse
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 异步解析 worker：消费 Redis 队列，跑 read→extract→chunk，写 Postgres + Redis
  celery-worker:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: py-parse-worker
    restart: always
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      mineru-api:
        condition: service_started
    environment:
      <<: *parse-env
      CELERY_WORKER_CONCURRENCY: "${CELERY_WORKER_CONCURRENCY:-2}"
    command: celery -A py_parse.adapters.celery_app worker --loglevel=info --concurrency=${CELERY_WORKER_CONCURRENCY:-2}

  # gRPC 控制面：对外暴露 SubmitParse / GetResult
  py-parse:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: py-parse
    restart: always
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    ports:
      - "50051:50051"
    environment:
      <<: *parse-env
      GRPC_HOST: 0.0.0.0
      GRPC_PORT: "50051"
    healthcheck:
      # 用标准 gRPC health 服务探测（grpcio-health-checking 已在镜像内）
      test:
        - CMD
        - python
        - -c
        - |
          import grpc
          from grpc_health.v1 import health_pb2, health_pb2_grpc
          ch = grpc.insecure_channel('localhost:50051')
          r = health_pb2_grpc.HealthStub(ch).Check(
              health_pb2.HealthCheckRequest(), timeout=5)
          assert r.status == health_pb2.HealthCheckResponse.SERVING
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

volumes:
  mineru-cache:
  mineru-uploads:
  mineru-logs:
  redis-data:
  pgdata:
