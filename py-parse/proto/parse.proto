syntax = "proto3";

package parse.v1;

// py-parser's external service contract (gRPC, async task model).
//
// Design points:
//   - Async: `SubmitParse` enqueues a parse task and returns a `task_id`
//     immediately; the caller polls `GetResult` for status and (when done)
//     the chunks. Heavy parsing runs in a separate worker pool (Celery).
//   - `source` is a uniform URI; the scheme selects the storage backend, the
//     remainder is the location within that backend.
//   - The request carries only *location* (doc_id + source). Connection config
//     (endpoints / credentials) lives in the config center, never in the request.
service ParseService {
  // Enqueue a parse task. Returns immediately with a task_id for polling.
  rpc SubmitParse(ParseRequest) returns (SubmitParseResponse);
  // Poll task status and (once SUCCESS) fetch the parsed chunks.
  rpc GetResult(GetResultRequest) returns (GetResultResponse);
}

message ParseRequest {
  // Logical identity of the document (business key, storage-agnostic; used for
  // provenance, status tracking, and chunk-id prefixing).
  string doc_id = 1;
  // Uniform resource URI: file:///... | minio://... | s3://... | oss://...
  string source = 2;
}

message SubmitParseResponse {
  string task_id = 1;
}

enum TaskStatus {
  TASK_STATUS_UNSPECIFIED = 0;
  TASK_STATUS_PENDING = 1;
  TASK_STATUS_RUNNING = 2;
  TASK_STATUS_SUCCESS = 3;
  TASK_STATUS_FAILED = 4;
}

message GetResultRequest {
  string task_id = 1;
}

message GetResultResponse {
  string task_id = 1;
  TaskStatus status = 2;
  // Set only when status == FAILED.
  string error = 3;
  // Set only when status == SUCCESS: the summary (chunk_count + doc_meta).
  ParseResult result = 4;
  // Set only when status == SUCCESS: the parsed chunks.
  repeated ParseChunk chunks = 5;
}

message ParseChunk {
  string chunk_id = 1;
  string text = 2;
  ChunkMetadata metadata = 3;
}

message ChunkMetadata {
  int32 page = 1;
  string heading = 2;
  string chunk_type = 3;   // "text" | "table" | "code" | "image"
}

message ParseResult {
  int32 chunk_count = 1;
  DocMeta doc_meta = 2;
}

message DocMeta {
  int32 total_pages = 1;
  string title = 2;
  string warning = 3;
}
